name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]' build
      - run: python -m pytest --cov=h11_cga --cov-fail-under=80
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: cd "$(mktemp -d)" && python -c "from importlib.resources import files; assert files('h11_cga.server').joinpath('static/dashboard.html').is_file()"
      - name: Windows acceptance with no skipped tests
        if: matrix.os == 'windows-latest' && matrix.python == '3.12'
        run: python tools/windows_acceptance.py
      - name: Upload Windows acceptance evidence
        if: always() && matrix.os == 'windows-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: windows-acceptance
          path: acceptance-results/
          if-no-files-found: error
